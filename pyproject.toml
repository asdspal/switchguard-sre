[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "switchguard-sre"
version = "1.0.0"
description = "Zero-PII Multi-Agent Incident Triage, Live Repro & FlashProve-Verified Rollback on Switch AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.22.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["demo_app", "tools"]
